name: Daily One Piece prices

on:
  schedule:
    - cron: "40 20 * * *"   # TCGCSV updates around 20:00 UTC (noon Pacific)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2 py7zr==1.1.4
      - run: python scripts/tracker.py
      - name: Save today's data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily prices"
          git pull --rebase && git push
